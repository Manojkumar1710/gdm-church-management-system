spring:
  application:
    name: gdm-church-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-only-32-chars
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  admin:
    seed-email: test-admin@gdmchurch.org
    seed-password: TestPass@123
  # Disable rate limiting during tests so login calls are not blocked
  rate-limit:
    enabled: false

cloudinary:
  cloud-name: placeholder
  api-key: placeholder
  api-secret: placeholder

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.gdm.church: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
