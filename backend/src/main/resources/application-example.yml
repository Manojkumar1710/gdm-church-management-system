spring:
  application:
    name: gdm-church-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gdm_church?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-database-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-minimum-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@gdmchurch.org}
    seed-password: ${ADMIN_SEED_PASSWORD:your-admin-password}

# -------------------------------------------------------------------
# Cloudinary
# -------------------------------------------------------------------
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-cloudinary-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-cloudinary-api-secret}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.gdm.church: DEBUG
    org.springframework.security: INFO