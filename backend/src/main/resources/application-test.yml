spring:
  datasource:
    url: jdbc:h2:mem:gdm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32chars+
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  admin:
    seed-email: test-admin@gdmchurch.org
    seed-password: TestPass@123
